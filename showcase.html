                <!-- This Page Contains Examples Of JavaScript Integration. Not All Good Practices Are Applied.-->

                <!-- USE CASE: using ev to identify and select based-on clicked element: -->
                 <h3>Identifying Clicked Elements Using JavaScript</h3>
                 <p>Check Console Whilst Clicking Buttons</p>
                <button class="myButton">Button 1</button>
                <button class="myButton">Button 2</button>
                <button class="myButton">Button 3</button>
                <script>
                const buttons = document.querySelectorAll('.myButton');

                buttons.forEach(button => {
                    button.addEventListener('click', function(ev) {
                    console.info(`Button clicked: ${ev.target.textContent}`);
                    });
                });
                </script>

                <br />
                <br />
                <br />
                
                <!-- USE CASE: Form Using JavaScript For Validation (ev.preventDefault();) -->
                <form id="myForm">
                    <input type="text" id="name" placeholder="Enter your name" required>
                    <button type="submit">Submit</button>
                </form>

                <script>
                const form = document.getElementById('myForm');
                const errMsg = document.getElementById('errMsg');

                form.addEventListener('submit', (ev) => {
                    const nameInput = document.getElementById('name');

                    if (nameInput.value.trim() === '') {
                    errMsg.innerText('Name is required!');
                    ev.preventDefault(); // Prevent form submission
                    }
                });
                </script>



            </div>
